name: documentation

#on: [push, pull_request, workflow_dispatch]
# Triggert die Doku erst, wenn der Test-Workflow abgeschlossen ist
on:
  workflow_run:
    workflows: ["Django CI (XPlanung Light)"]
    types:
      - completed
  # Ermöglicht weiterhin das manuelle Anstoßen im GitHub-UI
  workflow_dispatch: 


permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    # Verhindert, dass die Doku gebaut wird, wenn der Test-Workflow komplett fehlgeschlagen ist
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5

      - name: Install dependencies
        run: |
          pip install sphinx sphinx_rtd_theme myst_parser
      - name: Sphinx build
        run: |
          cd docs
          make html
      # NEU: Holt den HTML-Bericht aus dem Test-Workflow ab
      - name: Download Coverage-Artefakt
        uses: actions/download-artifact@v4
        continue-on-error: true # Verhindert, dass die Doku bricht, falls die Tests fehlschlagen/kein Artefakt existiert
        with:
          name: django-coverage-report
          path: docs/build/html/coverage # Legt es direkt im Zielordner ab   
          # Sagt GitHub, aus welchem konkreten Run das Artefakt geladen werden soll
          run-id: ${{ github.event.workflow_run.id }}       
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        # Hier greift nun die Logik für das Deployment auf dem Hauptbranch
        if: ${{ github.ref == 'refs/heads/master' || github.event.workflow_run.head_branch == 'master' }}

        with:
          publish_branch: gh-pages
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/build/html
          force_orphan: true