name: documentation

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
      - name: Install dependencies
        run: |
          pip install sphinx sphinx_rtd_theme myst_parser
      - name: Sphinx build
        run: |
          cd docs
          make html
      # NEU: Holt den HTML-Bericht aus dem Test-Workflow ab
      - name: Download Coverage-Artefakt
        uses: actions/download-artifact@v4
        continue-on-error: true # Verhindert, dass die Doku bricht, falls die Tests fehlschlagen/kein Artefakt existiert
        with:
          name: django-coverage-report
          path: docs/build/html/coverage # Legt es direkt im Zielordner ab          
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        with:
          publish_branch: gh-pages
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/build/html
          force_orphan: true