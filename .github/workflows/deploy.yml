name: Deploy static content to Pages

on:
  workflow_run:
    workflows: ["Django CI (XPlanung Light)"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # WICHTIG: Erlaubt das Lesen von Artefakten anderer Workflows
  actions: read 

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    
    if: |
      (github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch') &&
      (github.event.workflow_run.head_branch == 'master' || github.event_name == 'workflow_dispatch')
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Ohne diese beiden Zeilen gibt es keine Fassungen: fetch-depth: 1
          # (der Standard) holt weder die Versionstags noch genug Historie.
          fetch-depth: 0
          fetch-tags: true

      - name: Zweig master als lokale Referenz anlegen
        # sphinx-multiversion sieht nur lokale Referenzen; bei der Auslösung
        # über workflow_run steht nach dem Auschecken oft kein lokales
        # refs/heads/master, dann fehlt die Fassung des Hauptzweigs.
        # Nicht "git branch -f master HEAD" verwenden: das bricht mit Exit 128
        # ab, wenn master gerade ausgecheckt ist, und wirft den Job raus.
        run: git update-ref refs/heads/master HEAD

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sphinx Abhängigkeiten installieren
        run: |
          pip install -r docs/requirements.txt

      - name: Sphinx Dokumentation bauen
        run: |
          docs/build-versionen.sh

      # KORREKTUR: Expliziter Download über Github API Kontext
      - name: Download Coverage-Artefakt
        uses: actions/download-artifact@v4
        with:
          name: django-coverage-report
          path: docs/build/html/coverage
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/build/html'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4t
