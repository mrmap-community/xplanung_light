<!--Mapserver Template -->
<META HTTP-EQUIV="Content-Type" CONTENT="text/html; charset=utf-8">
<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
<head>
<title>Bauleitplanung Offenlagen gem. BauGB</title>
<style type="text/css">
</style>
</head>
<body>
	<br>
	<hr>
	<br>
	<table border="1" width="400" bgcolor="#ffffff" cellspacing="1" cellpadding="2" style="" rules='rows'>
		<tr>
        	<th align="left" bgcolor='#871e32' style="color:#FFFFFF" colspan='2'>Informationen zum Beteiligungsverfahren</td>
        </tr>
<!-- Obergrenze der Plaene pro Antwort: setzt der Django-OWS-Proxy per
     FEATURE_COUNT (XPLANUNG_LIGHT_CONFIG['getfeatureinfo_max_plaene']).
     Klassische Templates koennen die Feature-Zahl nicht selbst begrenzen. -->
        	<tr>
        		<td bgcolor='#F0F0F0' width="50%">Bezeichnung des Plans:</td>
        		<td bgcolor='#FFFFFF'><b>[name]</b> ([plantyp]:[plan_id])</td>
        	</tr>
			<tr>
        		<td bgcolor='#F0F0F0' width="50%">Verfahrenstyp:</td>
        		<td bgcolor='#FFFFFF'>[typ]</td>
        	</tr>
                <tr>
                        <td bgcolor='#F0F0F0' width="50%">Ortsübliche Bekanntmachung:</td>
                        <td bgcolor='#FFFFFF'>[bekanntmachung_datum]</td>
                </tr>
		<tr>
        		<td bgcolor='#F0F0F0' width="50%">Beginn der Offenlage:</td>
        		<td bgcolor='#FFFFFF'>[start_datum]</td>
        	</tr>
		<tr>
        		<td bgcolor='#F0F0F0' width="50%">Ende der Offenlage:</td>
        		<td bgcolor='#FFFFFF'>[end_datum]</td>
        	</tr>
		<tr>
        		<td bgcolor='#F0F0F0' width="50%">Link:</td>
        		<td bgcolor='#FFFFFF'><a href="[base_uri]/[plantyp]/[plan_id]" target="_blank">Informationen zum Plan</a></td>
        	</tr>
	</table>
<br>
<br>
<hr>
<br>
</body>
</html>
